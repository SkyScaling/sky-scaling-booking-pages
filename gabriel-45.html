<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your 45-Minute Call | Sky Scaling</title>
<meta name="description" content="Book a 45 minute call with Gabriel Tremblay, Founder of Sky Scaling.">
<meta name="theme-color" content="#06080F">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="https://assets.cdn.msgsndr.com/cIEiGPHzRWPAUucJJ6QA/media/63b8dfe3b7386074555ef2bb.png">

<!-- ================= CONFIG: EDIT THESE ================= -->
<script>
  window.SS_CONFIG = {
    LOGO_URL: "https://www.skyscaling.com/assets/sky-scaling-logo-vBi7C5xv.svg",
    PILL: "Book a call",

    PERSON_NAME: "Gabriel Tremblay",
    PERSON_ROLE: "Founder & CEO",
    PERSON_LOCATION: "",

    SHOW_PHOTO: true,
    PERSON_PHOTO: "gabriel.jpg",

    HEADLINE: "Book Your 45-Minute Call",
    SUBLINE: "",

    /* GoHighLevel calendar id. Swap this to point the page at a different calendar. */
    CALENDAR_ID: "vCe3LzryXwvvktCwH1ve",

    CONTACT_EMAIL: "hello@skyscaling.com"
  };
</script>
<!-- ===================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06080F;--panel:#0E1220;--panel-2:#131829;
    --border:rgba(148,160,196,0.14);--border-strong:rgba(148,160,196,0.30);
    --accent:#5271ff;--accent-2:#8f6bff;--accent-d:#3f5ae6;
    --accent-glow:rgba(82,113,255,0.50);--accent-tint:rgba(82,113,255,0.13);
    --grad:linear-gradient(135deg,#5271ff 0%,#8f6bff 100%);
    --text:#F5F7FE;--text-2:#AEB7D0;--text-3:#727C99;
    --radius:16px;--glow:0 22px 60px -20px var(--accent-glow);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif}
  .bg-grid,.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg-grid{background-image:linear-gradient(rgba(148,160,196,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,160,196,0.05) 1px,transparent 1px);background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse 95% 60% at 50% 0%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 95% 60% at 50% 0%,#000 25%,transparent 78%)}
  .bg-glow{background:radial-gradient(620px 440px at 16% 4%,rgba(82,113,255,0.20),transparent 68%),radial-gradient(620px 520px at 86% 98%,rgba(143,107,255,0.15),transparent 72%)}

  header{position:relative;z-index:2;width:100%;border-bottom:1px solid var(--border)}
  .hdr-inner{max-width:1080px;margin:0 auto;padding:18px clamp(20px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:14px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:18px;letter-spacing:-0.02em;min-width:0}
  .logo img{height:33px;width:auto;max-width:100%;display:block}
  .logo .fb{display:none;color:var(--text)}
  .pill{font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#c3ccff;border:1px solid var(--border);background:var(--accent-tint);padding:8px 15px;border-radius:999px;white-space:nowrap;flex:none}

  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 22px 84px}
  .eyebrow{text-align:center;color:var(--accent);font-family:'Space Grotesk';font-weight:700;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;margin:58px 0 22px}

  .shot{display:block;width:132px;height:132px;object-fit:cover;border-radius:50%;border:2px solid var(--border-strong);margin:0 auto 26px;box-shadow:0 22px 60px -20px var(--accent-glow)}

  h1.hero{text-align:center;font-weight:700;font-size:clamp(36px,5.2vw,46px);line-height:1.08;letter-spacing:-0.03em}
  .who{text-align:center;color:var(--text-2);font-size:15px;margin-top:14px}
  .who b{color:var(--text);font-weight:600}
  .role{text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:9px}
  .loc{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:13.5px;margin-top:11px}
  .loc svg{width:15px;height:15px;flex:none;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .subline{text-align:center;color:var(--text-2);font-size:15px;line-height:1.65;max-width:560px;margin:18px auto 0}
  .subline b{color:var(--text);font-weight:600}

  .cal-card{background:var(--accent-tint);border:1px solid var(--border-strong);border-radius:24px;padding:clamp(16px,2.4vw,30px);margin:40px auto 0;max-width:896px}
  .cal-card iframe{width:100%;min-height:640px;border:none;border-radius:var(--radius);background:#fff;display:block}

  .book-note{display:flex;gap:8px;align-items:flex-start;justify-content:center;text-align:center;color:var(--text-3);font-size:13px;line-height:1.5;margin-top:18px}
  .book-note svg{width:15px;height:15px;color:var(--accent);flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  footer{text-align:center;color:var(--text-3);font-size:12.5px;padding:44px 0 0;border-top:1px solid var(--border);margin-top:64px;line-height:1.8}
  footer a{color:var(--text-2);text-decoration:none}
  footer a:hover{color:var(--accent);text-decoration:underline}

  @media (max-width:700px){
    .hdr-inner{padding-top:21px;padding-bottom:21px}
    .logo img{height:27px}
    .pill{font-size:10px;letter-spacing:0.12em;padding:7px 12px}
    .eyebrow{margin:42px 0 18px}
    .shot{width:112px;height:112px;margin-bottom:22px}
    .cal-card{margin-top:26px}
    .cal-card iframe{min-height:600px}
    footer{padding-top:36px;margin-top:46px}
  }
</style>
</head>
<body>
<div class="bg-grid"></div><div class="bg-glow"></div>

<header><div class="hdr-inner">
  <div class="logo"><img id="logo" alt="Sky Scaling" src=""><span class="fb">Sky Scaling</span></div>
  <span class="pill" id="pill">Book a call</span>
</div></header>

<div class="wrap">

  <div class="eyebrow">&lt; Pick a time &gt;</div>

  <img class="shot" id="photo" alt="" style="display:none">

  <h1 class="hero" id="headline">Book Your 45-Minute Call</h1>
  <div class="who">with <b id="p-name">Gabriel Tremblay</b></div>
  <div class="role" id="p-role">Founder & CEO</div>
  <div class="loc" id="p-loc">
    <svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <span id="p-loc-t"></span>
  </div>

  <p class="subline" id="subline" style="display:none"></p>

  <div class="cal-card">
    <div id="cal-mount"></div>
    <p class="book-note">
      <svg viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
      <span>You'll get a confirmation email and a reminder before your call, so you won't miss it.</span>
    </p>
  </div>

  <footer>
    <div><a id="f-mail" href="#">hello@skyscaling.com</a></div>
    <div style="margin-top:6px">&copy; <span id="yr"></span> Sky Scaling Inc. All rights reserved.</div>
  </footer>

</div>

<script>
(function(){
  var C = window.SS_CONFIG || {};
  var $ = function(id){ return document.getElementById(id); };

  var y=$('yr'); if(y) y.textContent = new Date().getFullYear();

  var logo=$('logo');
  if(C.LOGO_URL){ logo.src=C.LOGO_URL; } else { logo.style.display='none'; document.querySelector('.logo .fb').style.display='inline-block'; }
  logo.onerror=function(){ logo.style.display='none'; document.querySelector('.logo .fb').style.display='inline-block'; };

  if(C.PILL) $('pill').textContent = C.PILL;
  if(C.HEADLINE) $('headline').textContent = C.HEADLINE;
  if(C.PERSON_NAME) $('p-name').textContent = C.PERSON_NAME;
  if(C.PERSON_ROLE) $('p-role').textContent = C.PERSON_ROLE;
  if(C.SUBLINE) $('subline').textContent = C.SUBLINE; else $('subline').style.display='none';

  if(C.PERSON_LOCATION){ $('p-loc-t').textContent = C.PERSON_LOCATION; } else { $('p-loc').style.display='none'; }

  var ph=$('photo');
  if(C.SHOW_PHOTO && C.PERSON_PHOTO){
    ph.src=C.PERSON_PHOTO; ph.alt=C.PERSON_NAME||''; ph.style.display='block';
    ph.onerror=function(){ ph.style.display='none'; };
  }

  var m=$('f-mail');
  if(C.CONTACT_EMAIL){ m.href='mailto:'+C.CONTACT_EMAIL; m.textContent=C.CONTACT_EMAIL; }

  /* GoHighLevel calendar embed. Their form_embed.js handles the auto-resizing. */
  if(C.CALENDAR_ID){
    var mount=$('cal-mount');
    var f=document.createElement('iframe');
    f.src='https://link.skyscaling.com/widget/booking/'+C.CALENDAR_ID;
    f.setAttribute('allow','payment');
    f.setAttribute('scrolling','no');
    f.id=C.CALENDAR_ID+'_book';
    f.title='Book your call';
    mount.appendChild(f);
    var s=document.createElement('script');
    s.src='https://link.skyscaling.com/js/form_embed.js';
    s.type='text/javascript';
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
